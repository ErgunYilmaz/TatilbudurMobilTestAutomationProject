<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Videosu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 32px 16px;
      color: #1f2937;
    }
    .card {
      max-width: 980px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #0f172a;
      font-size: 24px;
    }
    .video-wrap {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      border-radius: 12px;
      background: #000;
      object-fit: contain;
    }
    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Test Videosu</h2>
    <div class="video-wrap">
      <video controls preload="metadata">
        <source src="./video/test.mp4" type="video/mp4">
      </video>
    </div>
    <div class="note">Video sayfası ilk açılışta ekrana sığacak şekilde optimize edilmiştir.</div>
  </div>
</body>
</html>
