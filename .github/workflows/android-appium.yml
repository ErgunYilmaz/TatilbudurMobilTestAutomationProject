name: Android Appium Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  appium-test:
    runs-on: macos-latest # Emülatör performansı için macos tercih edilmeli

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          # Appium 2.x varsayılan olarak /wd/hub kullanmaz, direkt kök dizinden çalışır
          appium --log appium.log &
          sleep 10

     jobs:
     appium-test:
     runs-on: macos-13  # macos-latest (ARM) yerine macos-13 (Intel) kullanıyoruz
    
    steps:
      # ... diğer adımlar aynı ...
      
      - name: Run Android Emulator and Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64  # Intel işlemcide x86_64 kullanmalısın
          # ... geri kalan ayarlar aynı

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Logs & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            appium.log
            target/surefire-reports
