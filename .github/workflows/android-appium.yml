name: Android Appium Tests

on:
  workflow_dispatch:

jobs:
  appium-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Appium
        run: |
          npm install -g appium@next
          appium driver install uiautomator2

      - name: Start Appium
        run: |
          appium --base-path /wd/hub > appium.log 2>&1 &
          sleep 15

      - name: Run Android Emulator and Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu host -noaudio -no-boot-anim
          script: |
            adb devices
            adb install -r Apps/tb.apk
            mvn --no-transfer-progress clean test

      - name: Upload Appium Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
