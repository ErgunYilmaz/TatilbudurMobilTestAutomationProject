name: Android Appium Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # GitHub Actions cron UTC çalışır
    # Türkiye saati UTC+3
    # 00:00 TR = 21:00 UTC (bir önceki gün)
    # 06:00 TR = 03:00 UTC
    # 13:00 TR = 10:00 UTC
    # 17:00 TR = 14:00 UTC
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'

permissions:
  contents: write

env:
  REPO_NAME: TatilbudurMobilTestAutomationProject
  APK_RELEASE_TAG: apk-v1
  APK_ASSET_NAME: tb.apk
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/TatilbudurMobilTestAutomationProject

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node kur
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api30

      - name: KVM enable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK indir
        run: |
          mkdir -p Apps
          curl -fL -o Apps/tb.apk "https://github.com/${{ github.repository }}/releases/download/${{ env.APK_RELEASE_TAG }}/${{ env.APK_ASSET_NAME }}"
          ls -lah Apps

      - name: Appium ve Allure kur
        run: |
          npm install -g appium@next
          appium driver install uiautomator2
          npm install -g allure-commandline

      - name: Appium başlat
        run: |
          appium > appium.log 2>&1 &
          sleep 15

      - name: Emulator + Test + Video
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -x
            adb devices
            adb wait-for-device
            adb shell getprop sys.boot_completed || true

            adb shell rm -f /sdcard/test.mp4 || true
            rm -f ./test.mp4 || true

            echo "Video kaydı başlatılıyor"
            adb shell screenrecord /sdcard/test.mp4 > /dev/null 2>&1 &
            sleep 3

            echo "Test başlıyor"
            mvn -B --no-transfer-progress clean test || true

            echo "Video kaydı durduruluyor"
            adb shell pkill -INT screenrecord || true
            sleep 5

            echo "Video workspace'e alınıyor"
            adb pull /sdcard/test.mp4 ./test.mp4 || true

            echo "Kontroller"
            pwd
            ls -lah
            ls -lah target || true
            ls -lah target/allure-results || true
            ls -lah target/surefire-reports || true

      - name: Allure report oluştur
        id: allure_report
        if: always()
        run: |
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results 2>/dev/null)" ]; then
            mkdir -p target/allure-report
            allure generate target/allure-results --clean -o target/allure-report
            echo "report_ready=true" >> $GITHUB_OUTPUT
          else
            echo "report_ready=false" >> $GITHUB_OUTPUT
            echo "Allure sonuçları yok, rapor üretilmedi."
          fi

      - name: Mail özet bilgilerini hazırla
        id: mail_summary
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        run: |
          SUMMARY_FILE="target/allure-report/widgets/summary.json"

          if [ -f "$SUMMARY_FILE" ]; then
            TOTAL=$(grep -o '"total":[0-9]*' "$SUMMARY_FILE" | head -1 | cut -d: -f2)
            PASSED=$(grep -o '"passed":[0-9]*' "$SUMMARY_FILE" | head -1 | cut -d: -f2)
            FAILED=$(grep -o '"failed":[0-9]*' "$SUMMARY_FILE" | head -1 | cut -d: -f2)
            BROKEN=$(grep -o '"broken":[0-9]*' "$SUMMARY_FILE" | head -1 | cut -d: -f2)
            SKIPPED=$(grep -o '"skipped":[0-9]*' "$SUMMARY_FILE" | head -1 | cut -d: -f2)
          else
            TOTAL=0
            PASSED=0
            FAILED=0
            BROKEN=0
            SKIPPED=0
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Mail durum bilgisini hazırla
        id: mail_status
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        run: |
          if [ "${{ steps.mail_summary.outputs.failed }}" = "0" ] && [ "${{ steps.mail_summary.outputs.broken }}" = "0" ]; then
            echo "status_text=Başarılı" >> $GITHUB_OUTPUT
          else
            echo "status_text=İncelenmeli" >> $GITHUB_OUTPUT
          fi

      - name: Koşu linklerini hazırla
        id: run_links
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        run: |
          RUN_FOLDER="runs/run-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          REPORT_URL="${PAGES_BASE_URL}/${RUN_FOLDER}/"
          VIDEO_URL="${PAGES_BASE_URL}/${RUN_FOLDER}/video.html"
          echo "run_folder=${RUN_FOLDER}" >> $GITHUB_OUTPUT
          echo "report_url=${REPORT_URL}" >> $GITHUB_OUTPUT
          echo "video_url=${VIDEO_URL}" >> $GITHUB_OUTPUT

      - name: Publish klasörünü hazırla
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        run: |
          mkdir -p "public/${{ steps.run_links.outputs.run_folder }}"
          cp -R target/allure-report/* "public/${{ steps.run_links.outputs.run_folder }}/"

          mkdir -p "public/${{ steps.run_links.outputs.run_folder }}/video"
          if [ -f "./test.mp4" ]; then
            cp ./test.mp4 "public/${{ steps.run_links.outputs.run_folder }}/video/test.mp4"
          fi

          cat > "public/${{ steps.run_links.outputs.run_folder }}/video.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Test Videosu</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                background: #f4f7fb;
                margin: 0;
                padding: 32px 16px;
                color: #1f2937;
              }
              .card {
                max-width: 980px;
                margin: 0 auto;
                background: #ffffff;
                border-radius: 16px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
                padding: 24px;
              }
              h2 {
                margin-top: 0;
                margin-bottom: 16px;
                color: #0f172a;
                font-size: 24px;
              }
              .video-wrap {
                width: 100%;
                max-width: 860px;
                margin: 0 auto;
              }
              video {
                display: block;
                width: 100%;
                height: auto;
                max-height: 70vh;
                border-radius: 12px;
                background: #000;
                object-fit: contain;
              }
              .note {
                margin-top: 14px;
                font-size: 13px;
                color: #64748b;
                text-align: center;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <h2>Test Videosu</h2>
              <div class="video-wrap">
                <video controls preload="metadata">
                  <source src="./video/test.mp4" type="video/mp4">
                </video>
              </div>
              <div class="note">Video sayfası ilk açılışta ekrana sığacak şekilde optimize edilmiştir.</div>
            </div>
          </body>
          </html>
          EOF

          cat > public/index.html << EOF
          <!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=${{ steps.run_links.outputs.report_url }}">
            <title>Yönlendiriliyor...</title>
          </head>
          <body>
            <p>Son rapora yönlendiriliyorsunuz:
            <a href="${{ steps.run_links.outputs.report_url }}">Raporu Aç</a></p>
          </body>
          </html>
          EOF

          touch public/.nojekyll

      - name: Publish klasörünü kontrol et
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        run: |
          find public -maxdepth 4 -type f | sort || true

      - name: Allure sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Allure raporunu yükle
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
          if-no-files-found: warn

      - name: Logları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            target/surefire-reports
            appium.log
          if-no-files-found: warn

      - name: Video yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-video
          path: ./test.mp4
          if-no-files-found: warn

      - name: GitHub Pages'e yayınla
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true

      - name: Pages yayınının hazır olmasını bekle
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        run: |
          REPORT_URL="${{ steps.run_links.outputs.report_url }}"
          VIDEO_URL="${{ steps.run_links.outputs.video_url }}"

          echo "GitHub Pages yayını kontrol ediliyor..."
          for i in {1..18}; do
            REPORT_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$REPORT_URL")
            VIDEO_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$VIDEO_URL")

            echo "Deneme $i -> report:$REPORT_CODE video:$VIDEO_CODE"

            if [ "$REPORT_CODE" = "200" ] && [ "$VIDEO_CODE" = "200" ]; then
              echo "Pages yayını hazır."
              exit 0
            fi

            sleep 10
          done

          echo "Pages hala tam hazır değil. Mail yine de gönderilecek."

      - name: Test sonucu mail gönder
        if: always() && steps.allure_report.outputs.report_ready == 'true'
        uses: dawidd6/action-send-mail@v11
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Tatilbudur Mobil Test Raporu - Run #${{ github.run_number }}"
          to: "ergun.yilmaz@tatilbudur.com,erhan.isler@tatilbudur.com,letafet.erol@tatilbudur.com,kadir.akar@tatilbudur.com,abdullah.demirel@tatilbudur.com,berat.topcu@tatilbudur.com,isil.ozatik@tatilbudur.com,can.atalan@tatilbudur.com,samet.aydin@tatilbudur.com,huseyin.eraslan@tatilbudur.com,bahar.yildiz@tatilbudur.com,yaren.yilmaz@tatilbudur.com,omer.balkan@tatilbudur.com,turkunay.bas@tatilbudur.com,muhammed.yazici@tatilbudur.com,sude.sevim@tatilbudur.com"
          from: "Test Automation <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <!DOCTYPE html>
            <html lang="tr">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Tatilbudur Mobil Test Raporu</title>
            </head>
            <body style="margin:0; padding:0; background-color:#f3f6fb; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
              <table width="100%" cellspacing="0" cellpadding="0" style="padding:20px 0;">
                <tr>
                  <td align="center">

                    <!-- ANA KART -->
                    <table width="720" cellspacing="0" cellpadding="0" style="max-width:720px; width:100%; background:#ffffff; border-radius:14px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,0.08);">

                      <!-- HEADER -->
                      <tr>
                        <td style="background:#1e3a8a; padding:18px 20px; color:#ffffff; text-align:center;">
                          <div style="font-size:20px; font-weight:700;">
                            Tatilbudur Mobil Test Otomasyon Koşum Raporu
                          </div>
                        </td>
                      </tr>

                      <!-- CONTENT -->
                      <tr>
                        <td style="padding:20px;">

                          <!-- TEST OZET -->
                          <div style="font-size:15px; font-weight:700; margin-bottom:12px;">
                            Test Özeti
                          </div>

                          <table width="100%" cellspacing="0" cellpadding="0" style="margin-bottom:16px;">
                            <tr>

                              <td style="padding:6px;">
                                <div style="background:#eef2ff; border:1px solid #c7d2fe; border-radius:10px; padding:12px; text-align:center;">
                                  <div style="font-size:11px;">Toplam</div>
                                  <div style="font-size:20px; font-weight:700;">${{ steps.mail_summary.outputs.total }}</div>
                                </div>
                              </td>

                              <td style="padding:6px;">
                                <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:12px; text-align:center;">
                                  <div style="font-size:11px;">Passed</div>
                                  <div style="font-size:20px; font-weight:700;">${{ steps.mail_summary.outputs.passed }}</div>
                                </div>
                              </td>

                              <td style="padding:6px;">
                                <div style="background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:10px; text-align:center;">
                                  <div style="font-size:11px;">Failed</div>
                                  <div style="font-size:18px; font-weight:700;">${{ steps.mail_summary.outputs.failed }}</div>
                                </div>
                              </td>

                            </tr>

                            <tr>

                              <td style="padding:6px;">
                                <div style="background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:12px; text-align:center;">
                                  <div style="font-size:11px;">Broken</div>
                                  <div style="font-size:20px; font-weight:700;">${{ steps.mail_summary.outputs.broken }}</div>
                                </div>
                              </td>

                              <td style="padding:6px;">
                                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px; text-align:center;">
                                  <div style="font-size:11px;">Skipped</div>
                                  <div style="font-size:20px; font-weight:700;">${{ steps.mail_summary.outputs.skipped }}</div>
                                </div>
                              </td>

                              <td style="padding:6px;">
                                <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:10px; text-align:center;">
                                  <div style="font-size:11px;">Durum</div>
                                  <div style="font-size:15px; font-weight:700;">
                                    ${{ steps.mail_status.outputs.status_text }}
                                  </div>
                                </div>
                              </td>

                            </tr>
                          </table>

                          <!-- LINKLER -->
                          <div style="font-size:15px; font-weight:700; margin-bottom:10px;">
                            Hızlı Erişim
                          </div>

                          <table width="100%" cellspacing="0" cellpadding="0">

                            <tr>
                              <td style="padding-bottom:10px;">
                                <a href="${{ steps.run_links.outputs.report_url }}" 
                                   style="display:block; text-decoration:none; background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:12px; color:#1d4ed8;">
                                  <b>Test Raporunu Aç</b><br>
                                  <span style="font-size:12px;">Detaylı test sonuçları</span>
                                </a>
                              </td>
                            </tr>

                            <tr>
                              <td>
                                <a href="${{ steps.run_links.outputs.video_url }}" 
                                   style="display:block; text-decoration:none; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:12px; color:#15803d;">
                                  <b>Test Videosunu Aç</b><br>
                                  <span style="font-size:12px;">Koşu videosu</span>
                                </a>
                              </td>
                            </tr>

                          </table>

                        </td>
                      </tr>

                      <!-- FOOTER -->
                      <tr>
                        <td style="padding:14px; background:#f8fafc; font-size:11px; text-align:center; color:#64748b;">
                          Tatilbudur Mobil Test Otomasyonu<br>
                          Branch: <b>${{ github.ref_name }}</b>
                        </td>
                      </tr>

                    </table>

                  </td>
                </tr>
              </table>
            </body>
            </html>