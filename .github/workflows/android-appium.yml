name: Android Appium Regression Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  appium-test:
    # Kritik Düzeltme: Sadece 'macos-13' yazıyoruz. 
    # 'us-default' gibi ekler GitHub tarafından desteklenmez.
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Android Emulator and Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # Emülatörün arka planda sorunsuz çalışması için gerekli parametreler
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Appium sunucusunu arka planda başlatıyoruz
            appium --log appium.log & 
            
            # Sunucunun tamamen ayağa kalkması için kısa bir süre bekleyelim
            sleep 10 
            
            # Maven testlerini başlatıyoruz
            mvn clean test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Logs & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-logs
          path: |
            appium.log
            target/surefire-reports/
