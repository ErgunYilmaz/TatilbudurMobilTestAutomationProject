name: Android Appium Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: KVM enable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Appium ve Allure kur
        run: |
          npm install -g appium@next
          appium driver install uiautomator2
          npm install -g allure-commandline

      - name: Appium başlat
        run: |
          appium > appium.log 2>&1 &
          sleep 15

      - name: Emulator + Test + Video
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -x
            adb devices

            adb shell rm -f /sdcard/test.mp4 || true
            rm -f ./test.mp4 || true

            echo "Video kaydı başlatılıyor"
            adb shell screenrecord /sdcard/test.mp4 > /dev/null 2>&1 &
            sleep 3

            echo "Test başlıyor"
            mvn -B --no-transfer-progress clean test || true

            echo "Video kaydı durduruluyor"
            adb shell pkill -INT screenrecord || true
            sleep 5

            echo "Cihazda video kontrol"
            adb shell ls -l /sdcard/test.mp4 || true

            echo "Video workspace'e alınıyor"
            adb pull /sdcard/test.mp4 ./test.mp4 || true

            echo "Workspace kontrol"
            ls -lah
            [ -f ./test.mp4 ] && echo "VIDEO_OK" || echo "VIDEO_YOK"
            ls -lah target || true
            ls -lah target/allure-results || true

      - name: Allure report oluştur
        if: always()
        run: |
          mkdir -p target/allure-report

          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results 2>/dev/null)" ]; then
            allure generate target/allure-results --clean -o target/allure-report
          else
            echo "<html><body><h1>Allure sonuçları bulunamadı</h1><p>target/allure-results klasörü boş veya oluşmadı.</p></body></html>" > target/allure-report/index.html
          fi

      - name: Pages klasörünü hazırla
        if: always()
        run: |
          mkdir -p public
          cp -R target/allure-report/* public/ || true
          touch public/.nojekyll

          if [ -f "./test.mp4" ]; then
            cp ./test.mp4 public/test.mp4
          fi

          cat > public/links.html << 'EOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tatilbudur Test Raporu</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              a { display: block; margin: 12px 0; font-size: 18px; }
            </style>
          </head>
          <body>
            <h1>Tatilbudur Mobil Test Çıktıları</h1>
            <a href="./index.html">Allure Raporunu Aç</a>
            <a href="./test.mp4">Test Videosunu Aç</a>
          </body>
          </html>
          EOF

      - name: Allure sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Allure raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
          if-no-files-found: warn

      - name: Logları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            target/surefire-reports
            appium.log
          if-no-files-found: warn

      - name: Video yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-video
          path: ./test.mp4
          if-no-files-found: warn

      - name: GitHub Pages'e yayınla
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
