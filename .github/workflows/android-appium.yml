name: Android Appium Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Appium kur
        run: |
          npm install -g appium@next
          appium driver install uiautomator2

      - name: Appium başlat
        run: |
          appium > appium.log 2>&1 &
          sleep 15

      - name: Emulator + Test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb devices

            echo "Video kaydı başlatılıyor"
            adb shell screenrecord /sdcard/test.mp4 &
            sleep 2

            echo "Test başlıyor"
            mvn -B --no-transfer-progress clean test || true

            echo "Video kaydı durduruluyor"
            adb shell pkill -l INT screenrecord || true
            sleep 2

            echo "Video alınıyor"
            adb pull /sdcard/test.mp4 || true

      - name: Allure report oluştur
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate target/allure-results --clean -o target/allure-report

      - name: Video sayfası oluştur
        if: always()
        run: |
          mkdir -p target/allure-report
          cp test.mp4 target/allure-report/ || true
          echo "<html><body><h2>Test Videosu</h2><video width='800' controls><source src='test.mp4' type='video/mp4'></video></body></html>" > target/allure-report/video.html

      - name: GitHub Pages için hazırla
        if: always()
        run: |
          touch target/allure-report/.nojekyll

      - name: Pages artifact yükle
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

      - name: GitHub Pages'e deploy et
        if: always()
        uses: actions/deploy-pages@v4

      - name: Mail gönder
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Tatilbudur Mobil Test Raporu"
          to: |
            ergun.yilmaz@tatilbudur.com,
            letafet.erol@tatilbudur.com,
            erhan.isler@tatilbudur.com,
            huseyin.eraslan@tatilbudur.com
          from: "Test Automation <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h2>Test Sonuçları</h2>

            <p><b>Allure Rapor:</b><br>
            <a href="https://ergunyilmaz.github.io/TatilbudurMobilTestAutomationProject/">
            Raporu Aç</a></p>

            <p><b>Test Videosu:</b><br>
            <a href="https://ergunyilmaz.github.io/TatilbudurMobilTestAutomationProject/video.html">
            Videoyu Aç</a></p>

            <p>Bu mail otomatik gönderildi.</p>
