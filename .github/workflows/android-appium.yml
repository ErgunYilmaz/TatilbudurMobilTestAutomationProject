name: Android Appium Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Appium kur
        run: |
          npm install -g appium@next
          appium driver install uiautomator2

      - name: Appium başlat
        run: |
          appium > appium.log 2>&1 &
          sleep 20

      - name: Emulator + Test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            echo "DEVICE BEKLENİYOR..."
            adb wait-for-device

            echo "BOOT BEKLENİYOR..."
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done;'

            echo "DEVICE LIST"
            adb devices

            echo "TEST BAŞLIYOR"
            mvn -B clean test

      - name: Allure sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Logları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            target/surefire-reports
            appium.log
